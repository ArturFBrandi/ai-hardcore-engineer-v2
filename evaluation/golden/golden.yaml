    facts:
      - {text: "Get Smart is a smart (Android/touchscreen) machine that runs apps", patterns: ["android", "touch", "aplicativos?|apps?\\b|getstore", "inteligente|smart card machine"]}
      - {text: "Get Smart usage fee R$ 129,90/month when revenue thresholds are not met", patterns: ["129[,.]90"]}
      - {text: "Get Clássica usage fee R$ 79,90/month when revenue thresholds are not met", patterns: ["79[,.]90"]}
    must_not:
      - {text: "invented price for either machine", patterns: ["(99|59|149|199)[,.]90"]}

