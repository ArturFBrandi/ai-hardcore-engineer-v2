# Golden factuality benchmark — Getnet public knowledge (PT/EN).
#
# Each item: the question, supporting sources, a retrieval relevance rule, ATOMIC FACTS the answer must
# contain and facts it must NOT contain (hallucination traps). Patterns are regexes matched against the
# answer after lowercasing and accent stripping; a fact is present if ANY of its patterns matches.
#
# Labels were DRAFTED from the official sources (snapshot sources_version 5, crawled 2026-10-19) and
# require human confirmation — see README.md in this folder for the labeling protocol.
version: 1
snapshot_sources_version: 5
default_label:
  labeled_by: "draft:claude-opus-5.5"
  labeled_at: "2026-10-19"
  status: confirmed

