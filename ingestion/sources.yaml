# First matching rule wins. `match` is a regex over the URL; `keywords` match title/heading text.
categories:
  - {category: receivables_advance, match: 'antecipa|reserva-financeira', keywords: ['antecipação', 'antecipacao', 'receba já']}
  - {category: terminal_troubleshooting, match: 'get-ajuda-erros-maquininha|get-ajuda-configuracoes|solucoes-get-smart|manutencao', keywords: []}
  - {category: settlement, match: 'repasse|recebimento|agenda|receba-ja', keywords: ['prazo de recebimento', 'repasse', 'agenda de recebíveis', 'quando cai']}
  - {category: pix, match: '/pix', keywords: ['pix']}
  - {category: payment_link, match: 'link-de-pagamento|whatsapp|getcheckout|online-payments', keywords: ['link de pagamento', 'payment link']}
  - {category: crediario, match: 'crediario|parcelado|pagamento-carne', keywords: ['crediário', 'crediario']}
  - {category: terminal_troubleshooting, match: '/duvidas/operacional|manual|Manul', keywords: ['não conecta', 'conexão', 'wi-fi', 'chip', 'erro', 'reinici']}
  - {category: fees, match: '/duvidas/taxas|tarifas|taxas', keywords: ['taxa', 'tarifa', 'mdr']}
  - {category: card_machines, match: 'maquininha|get-smart|get-tap|get-mini|get-classica|in-person|duvidas/(get-smart|get-tap|aluguel|plano-light|pos-digital)', keywords: ['get smart', 'get clássica', 'get mini', 'get tap']}
  - {category: sales_management, match: 'gestao-de-vendas|estorno|chargeback', keywords: ['status das suas vendas', 'estorno']}
  - {category: account, match: 'conta-digital|get-conta|app-getnet|portal-do-cliente|cancelamento|get-ajuda-cadastro', keywords: ['conta digital', 'app getnet']}
  - {category: contact, match: 'fale-conosco|ouvidoria|contact|contacto', keywords: ['central de atendimento', 'ouvidoria']}
  - {category: faq, match: '/duvidas/', keywords: []}

products:
  - {product: Get Smart, keywords: ['get smart', 'getsmart']}
  - {product: Get Clássica, keywords: ['get clássica', 'get classica', 'getclassica', 'get classic']}
  - {product: Get Mini, keywords: ['get mini', 'getmini']}
  - {product: Get Lite, keywords: ['get lite', 'getlite']}
  - {product: Get Renova, keywords: ['get renova']}
  - {product: Get Tap, keywords: ['get tap', 'tap on phone']}
  - {product: Link de Pagamento, keywords: ['link de pagamento', 'payment link', 'getpay']}
  - {product: Pix, keywords: [' pix']}
  - {product: Crediário, keywords: ['crediário', 'crediario']}
