# Getnet knowledge-base catalogue (official public sources only).
# The crawler starts from `seeds`, follows links inside `allowed_domains` that match `allow` and do not
# match `deny`, up to `max_depth` and `max_pages`. robots.txt is honoured; requests are rate limited.
# Categories/products are assigned by the first matching rule in `categories` / `products`
# (URL pattern or title/heading keyword). Do not hardcode the catalogue in Python.

version: 5
user_agent_env: INGEST_USER_AGENT
max_depth: 2
max_pages: 220
freshness_days: 14         # documents not re-validated within this window count as stale

allowed_domains:
  - site.getnet.com.br
  - www.getnet.net

allow:
  - '^https://site\.getnet\.com\.br/(duvidas|get-ajuda|boas-vindas|todas-as-maquininhas|pix|link-de-pagamento|crediario|get-tap|getcheckout|pagamentos-pelo-whatsapp|pagamentos-recorrentes|emprestimo|split|conta-digital|get-ajuda-reserva-financeira|bandeiras|fale-conosco|ouvidoria|taxas-personalizadas|proteja-seu-negocio-e-venda-com-seguranca|recargas|conversor-de-moedas|portal-do-cliente|tef|maquininha|get-)'
  - '^https://site\.getnet\.com\.br/wp-content/uploads/.*\.pdf$'
  - '^https://www\.getnet\.net/en/(our-solutions|contact|corporate/about-us|developers|partners)'
  - '^https://www\.getnet\.net/en/?$'
  - '^https://www\.getnet\.net/pt/(suporte|as-nossas-solucoes|tarifas|contacto)'

deny:
  - '/wp-json/'
  - '/feed/?$'
  - '/(carreiras|carreira|imprensa|patrocinios|sustentabilidade|report-vulnerability|partners/)'
  - 'regulamento|denuncia'
  - '/duvidas/(carreira|superdigital|algar|politica-de-privacidade)/'
  - '\.(png|jpe?g|gif|svg|webp|css|js|ico|zip|mp4)(\?|$)'
  - '/(blog|post|tag|category|author)/'
  - '/wp-content/uploads/.*(Codigo-de-Conduta|Termo_|Contrato)'
  - '[?#]'

