name: Live provider validation
# Real MiniMax-M3 / Tavily checks. Scheduled + manual only; runs only when the repository secrets exist,
# so forks and fork PRs never fail for lack of credentials.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LINK_MODE: copy
  MODELS_DIR: /home/runner/.cache/getnet-models
  DATASTORES: external

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      WEB_SEARCH_API_KEY: ${{ secrets.WEB_SEARCH_API_KEY }}
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env: {POSTGRES_USER: getnet, POSTGRES_PASSWORD: getnet-dev-only, POSTGRES_DB: getnet}
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U getnet -d getnet" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
        ports: ["56379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
        ports: ["56333:6333"]
    steps:
      - name: Skip cleanly without credentials
        id: creds
        run: |
          if [ -z "$MINIMAX_API_KEY" ]; then
            echo "MINIMAX_API_KEY secret not available (fork or not configured) — live validation skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.run == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.creds.outputs.run == 'true'
        with: {enable-cache: true}
      - uses: actions/cache@v4
        if: steps.creds.outputs.run == 'true'
        with:
          path: ${{ env.MODELS_DIR }}
          key: models-${{ hashFiles('config/models.lock.json') }}
      - name: make llm-test
        if: steps.creds.outputs.run == 'true'
        run: make llm-test
      - name: make test-live
        if: steps.creds.outputs.run == 'true'
        run: make test-live
      - name: make eval-live
        if: steps.creds.outputs.run == 'true'
        run: make eval-live
      - uses: actions/upload-artifact@v4
        if: steps.creds.outputs.run == 'true' && always()
        with:
          name: live-evaluation
          path: evaluation/results/live-latest.*
