# Round-robin reverse proxy in front of N API replicas (scale test). The `api` name resolves to every
# replica through Docker's embedded DNS; re-resolved every 5s so scaling up/down is picked up.
worker_processes 1;
events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream api_backend {
    zone api_backend 64k;
    server api:8000 resolve;
  }
  server {
    listen 8080;
    client_max_body_size 32k;
    location / {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header Connection "";
      proxy_buffering off;              # SSE
      proxy_read_timeout 180s;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
