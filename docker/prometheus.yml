global:
  scrape_interval: 10s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    # Every replica of the `api` service (Docker DNS returns one A record per container).
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
        refresh_interval: 15s
    metrics_path: /metrics
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
        refresh_interval: 15s
